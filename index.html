<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据大屏中心 · DataV Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; font-family: "Microsoft YaHei", sans-serif; color: #cfe3ff;
      background: radial-gradient(1200px 700px at 20% -10%, rgba(30,90,180,.3), transparent 60%),
                  radial-gradient(1000px 600px at 90% 110%, rgba(20,120,160,.2), transparent 60%),
                  linear-gradient(160deg, #071433, #020613);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; overflow: hidden; }
    .bg-grid { position: fixed; inset: 0; pointer-events: none;
      background-image: linear-gradient(rgba(40,110,200,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(40,110,200,0.06) 1px, transparent 1px);
      background-size: 44px 44px; -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 50%, transparent 100%); mask-image: radial-gradient(circle at 50% 40%, #000 50%, transparent 100%); }
    header { text-align: center; position: relative; }
    h1 { font-size: 40px; letter-spacing: 4px; background: linear-gradient(180deg,#fff,#8ec6ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 30px rgba(60,150,255,.4); }
    .sub { color: #7f9dc9; font-size: 14px; letter-spacing: 3px; margin-top: 10px; }
    .cards { display: flex; gap: 34px; position: relative; flex-wrap: wrap; justify-content: center; }
    a.card { width: 380px; min-height: 210px; text-decoration: none; color: inherit;
      border: 1px solid rgba(45,120,210,.4); border-radius: 14px; padding: 26px;
      background: linear-gradient(135deg, rgba(20,45,90,.6), rgba(10,22,48,.5));
      display: flex; flex-direction: column; gap: 10px; transition: .28s; position: relative; overflow: hidden; }
    a.card::before { content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 3px; background: linear-gradient(90deg, transparent, rgba(60,150,255,.8), transparent); }
    a.card:hover { transform: translateY(-8px); border-color: #22d3ee; box-shadow: 0 16px 44px rgba(34,150,255,.35); }
    a.card .tag { font-size: 12px; color: #22d3ee; letter-spacing: 2px; }
    a.card h2 { font-size: 22px; color: #eaf4ff; }
    a.card p { font-size: 13px; color: #8aa6cf; line-height: 1.6; flex: 1; }
    a.card .go { font-size: 14px; color: #5aa0ff; }
    a.card:hover .go { color: #22d3ee; }
    a.card.vue:hover { border-color: #42d392; box-shadow: 0 16px 44px rgba(66,211,146,.3); }
    a.card.vue .tag, a.card.vue:hover .go { color: #42d392; }
    footer { color: #3a5680; font-size: 12px; letter-spacing: 2px; position: relative; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <header>
    <h1>数据大屏中心 · DataV Hub</h1>
    <p class="sub">STATIC PROTOTYPE COLLECTION · REACT &amp; VUE</p>
  </header>
  <div class="cards">
    <a class="card react" href="./react/index.html">
      <span class="tag">REACT · React 版</span>
      <h2>数据大屏中心</h2>
      <p>React + Vite 实现：空压综合管理平台、絮凝剂制备 SCADA、取配水调度监控、智慧园区综合安防 IOC 等多款大屏。</p>
      <span class="go">进入 React 版 →</span>
    </a>
    <a class="card vue" href="./vue/index.html">
      <span class="tag">VUE · Vue 版</span>
      <h2>数据大屏中心</h2>
      <p>Vue 3 + Vite 实现：同一套大屏原型的 Vue 版本。</p>
      <span class="go">进入 Vue 版 →</span>
    </a>
  </div>
  <footer>纯前端静态原型集 · 无需后端 · 源码不随本仓库发布</footer>
</body>
</html>
